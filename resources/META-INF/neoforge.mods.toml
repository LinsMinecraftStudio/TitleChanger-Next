modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}-neoforge.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"
issueTrackerURL = "https://github.com/LinsMinecraftStudio/TitleChanger-Next/issues/"
displayURL = "https://modrinth.com/mod/titlechanger-next"
logoFile = "icon.png"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
[[dependencies."${mod_id}"]]
modId = "cloth_config"
type = "required"
versionRange = "[26.1.0,)"
ordering = "NONE"
side = "CLIENT"
[[dependencies."${mod_id}"]]
modId = "placeholder_api_neoforge"
type = "optional"
versionRange = "[3.0.0+26.1+neoforge,)"
ordering = "NONE"
side = "CLIENT"